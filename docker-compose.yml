services:
  planka:
    image: ghcr.io/plankanban/planka:latest
    restart: always
    volumes:
      - data:/app/data
    environment:
      - BASE_URL=${BASE_URL}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres/${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - TRUST_PROXY=true
      - DEFAULT_ADMIN_EMAIL=${ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEFAULT_ADMIN_NAME=${ADMIN_NAME}
      - DEFAULT_ADMIN_USERNAME=${ADMIN_USERNAME}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1337/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  mcp-planka:
    image: mgertz/mcp-planka:latest
    restart: unless-stopped
    ports:
      - "${MCP_PORT}:25478"
    environment:
      - PLANKA_URL=http://planka:1337
      - PLANKA_EMAIL=${ADMIN_EMAIL}
      - PLANKA_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      planka:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    environment:
      - PUID=1000 
      - PGID=1000
      - TZ=Europe/Copenhagen
      - DOCKER_MODS=linuxserver/mods:universal-package-install # Valgfrit: til ekstra pakker
    volumes:
      - ./obsidian-config:/config 
      - ../:/vault               # Mounter repository root (inkl. agent-output)
    ports:
      - 3000:3000   # HTTP GUI
      - 3001:3001   # HTTPS GUI
      - 27124:27124 # Obsidian Local REST API (VIGTIG for MCP)
    shm_size: "1gb"
    restart: unless-stopped
    
  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - planka

volumes:
  data:
  db-data: