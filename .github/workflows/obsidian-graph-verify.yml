name: Obsidian Graph Verify

on:
  pull_request:
    paths:
      - "agent-output/workflows/**/*.md"
      - "agent-output/ops/workflow-index.md"
      - "vs-code-agents/skills/obsidian-workflow/**"
      - ".github/workflows/obsidian-graph-verify.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "agent-output/workflows/**/*.md"
      - "agent-output/ops/workflow-index.md"
      - "vs-code-agents/skills/obsidian-workflow/**"
      - ".github/workflows/obsidian-graph-verify.yml"

jobs:
  verify-obsidian-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Obsidian workflow graph
        shell: bash
        run: |
          set -euo pipefail
          node vs-code-agents/skills/obsidian-workflow/scripts/verify-obsidian-graph.mjs --workspace-root .
